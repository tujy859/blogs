<header class="site-topbar">
  <div class="topbar-inner">
    <div class="topbar-brand">
      <a href="{{ '/' | relative_url }}" class="brand-link">
        <span class="brand-icon">🐱</span>
        <span class="brand-text">{{ site.title }}</span>
      </a>
      <span class="topbar-tagline">· Biomedical Engineering & Wearable Health Algorithms</span>
    </div>
    <div class="topbar-links">
      <a href="{{ '/' | relative_url }}" class="topbar-link">Home</a>
      <a href="{{ '/all-posts/' | relative_url }}" class="topbar-link">All Posts ({{ site.posts | size }})</a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="topbar-link topbar-external">GitHub ↗</a>
    </div>
  </div>
</header>
