<aside class="blog-sidebar">
  <div class="sidebar-profile">
    <div class="avatar-wrap">
      <img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}" class="sidebar-avatar" loading="lazy">
    </div>
    <h2 class="sidebar-name">{{ site.author.name }}</h2>
    <p class="sidebar-bio">{{ site.author.bio }}</p>

    <div class="sidebar-contact">
      <a href="mailto:{{ site.email }}" class="contact-item" title="Email">
        <span class="contact-icon"><svg height="15" width="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <span class="contact-text">{{ site.email }}</span>
      </a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="contact-item" title="GitHub">
        <span class="contact-icon"><svg height="15" width="15" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: -2px;"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></span>
        <span class="contact-text">github.com/{{ site.github_username }}</span>
      </a>
      <a href="https://www.xiaohongshu.com/search_result?keyword=%E7%82%B9%E7%82%B9%E5%B1%85" target="_blank" rel="noopener noreferrer" class="contact-item" title="在小红书关注 点点居">
        <span class="contact-icon"><span class="xhs-mark">书</span></span>
        <span class="contact-text">小红书：点点居</span>
      </a>
    </div>
  </div>

  <div class="sidebar-widget stats-widget">
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-num">{{ site.posts | size }}</span>
        <span class="stat-label">篇文章</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="site-visit-count">—</span>
        <span class="stat-label">总访问</span>
      </div>
    </div>
  </div>
</aside>
