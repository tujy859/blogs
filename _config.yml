name: Jinying's Blog
title: Jinying's Blog
description: "记录思考、技术实战与探索足迹 · Personal Tech Blog & Knowledge Base"
baseurl: ""
url: "https://tujinying.me"
github_username: tujy859
permalink: /:year/:month/:day/:title/
future: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - "node_modules"
  - "vendor/bundle"
  - "Gemfile"
  - "Gemfile.lock"

author:
  name: "Jinying Tu"

social:
  github: "https://github.com/tujy859"
