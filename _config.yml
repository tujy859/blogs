name: My Blog
title: My Blog
description: "My blogs for learning and recording"
baseurl: "/blogs"
url: "https://tujy859.github.io"
github_username: tujy859
future: true

# Plugins and i18n
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-multiple-languages-plugin

languages: ["en", "zh"]
default_lang: "en"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - "node_modules"
  - "vendor/bundle"
  - "Gemfile"
  - "Gemfile.lock"

author:
  name: "Jinying Tu"

social:
  github: "https://github.com/tujy859"
