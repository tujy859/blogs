---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%b %-d, %Y" }}</span>
      <span class="post-reads"> • Reads: <span id="read-count">0</span></span>
    </div>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <nav class="post-nav">
    <div class="prev">
      {% if page.previous %}
        <a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>
      {% endif %}
    </div>
    <div class="next">
      {% if page.next %}
        <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>
      {% endif %}
    </div>
  </nav>
</article>
